components:
  schemas:
    CidrWhiteListUpdateRequest:
      type: object
      properties:
        subscriptionId:
          type: integer
          format: int32
          readOnly: true
        cidrIps:
          type: array
          description: 'List of CIDR values. Example: [''10.1.1.0/32'']'
          items:
            type: string
            description: 'List of CIDR values. Example: [''10.1.1.0/32'']'
        securityGroupIds:
          type: array
          description: List of AWS Security group IDs.
          items:
            type: string
            description: List of AWS Security group IDs.
        commandType:
          type: string
          readOnly: true
      description: Update Pro subscription
    RedisVersions:
      type: object
      properties:
        redisVersions:
          type: array
          items:
            $ref: '#/components/schemas/RedisVersion'
    SubscriptionMaintenanceWindows:
      type: object
      properties:
        mode:
          type: string
          enum:
          - manual
          - automatic
        timeZone:
          type: string
        windows:
          type: array
          items:
            $ref: '#/components/schemas/MaintenanceWindow'
        skipStatus:
          $ref: '#/components/schemas/MaintenanceWindowSkipStatus'
    SubscriptionPricing:
      type: object
      properties:
        type:
          type: string
        typeDetails:
          type: string
        quantity:
          type: integer
          format: int32
        quantityMeasurement:
          type: string
        pricePerUnit:
          type: number
          format: double
        priceCurrency:
          type: string
        pricePeriod:
          type: string
        region:
          type: string
    ActiveActiveRegionCreateRequest:
      type: object
      properties:
        subscriptionId:
          type: integer
          format: int32
          readOnly: true
        region:
          type: string
          description: Name of region to add as defined by the cloud provider.
        vpcId:
          type: string
          description: Optional. Enter a VPC identifier that exists in the hosted AWS account. Creates a new VPC if not set. VPC Identifier must be in a valid format and must exist within the hosting account.
          example: vpc-0125be68a4625884ad
        deploymentCIDR:
          type: string
          description: Deployment CIDR mask. Must be a valid CIDR format with a range of 256 IP addresses.
          example: 10.0.0.0/24
        subnetIds:
          type: array
