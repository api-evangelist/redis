components:
  schemas:
    ActiveActiveVpcPeeringCreateGcpRequest:
      required:
      - sourceRegion
      - vpcNetworkName
      - vpcProjectUid
      type: object
      properties:
        provider:
          type: string
        subscriptionId:
          type: integer
          format: int32
          readOnly: true
        sourceRegion:
          type: string
          description: Name of region to create a VPC peering from.
        vpcProjectUid:
          type: string
          description: VPC project ID.
          example: <vpc-identifer>
        vpcNetworkName:
          type: string
          description: VPC network name.
          example: <name>
        commandType:
          type: string
          readOnly: true
      description: VPC peering creation request message
    PrivateLinkActiveActiveConnectionsDisassociateRequest:
      required:
      - connections
      type: object
      properties:
        subscriptionId:
          type: integer
          format: int32
          readOnly: true
        regionId:
          type: integer
          description: Deployment region id as defined by cloud provider
          format: int32
          readOnly: true
        connections:
          type: array
          description: List of connections to disassociate from the private link. Each connection must include associationId, type, and principalId.
          items:
            $ref: '#/components/schemas/PrivateLinkConnectionDisassociate'
        commandType:
          type: string
          readOnly: true
      description: Request to disassociate connections from private link for Active-Active subscription
    PrivateLinkPrincipalsDeleteRequest:
      required:
      - principal
      type: object
      properties:
        subscriptionId:
          type: integer
          format: int32
          readOnly: true
        principal:
          type: string
          description: An AWS account ID or ARN to remove from the private link
          example: '123456789012'
        commandType:
          type: string
          readOnly: true
      description: Private Link principals delete request
    PrivateLinkCreateRequest:
      required:
      - principal
      - shareName
      - type
      type: object
      properties:
        subscriptionId:
          type: integer
          format: int32
          readOnly: true
        shareName:
          maxLength: 64
          minLength: 0
          type: string
          description: Name of the resource share
          example: my-redis-share
        principal:
          type: string
          description: AWS account ID or ARN of the principal (IAM user, role, or account)
          example: '123456789012'
        type:
          type: string
          description: Type of the principal
          example: aws_account
          enum:
          - aws_account
          - organization
          - organization_unit
          - iam_role
          - iam_user
          - service_principal
        alias:
          type: string
          description: Alias or friendly name for the principal
          example: Production Account
        commandType:
          type: string
          readOnly: true
      description: Private Link create request
    PrivateLinkConnectionDisassociate:
      required:
      - associationId
      - principalId
      - type
      type: object
      properties:
        associationId:
          type: string
          description: Resource share association ID
          example: rsa-12345678
        connectionId:
          type: string
          description: VPC endpoint connection ID
          example: vpce-con-12345678
        type:
          type: string
          description: Type of the connection
          example: vpc_endpoint
        principalId:
          type: string
          description: Principal ID that owns the connection, e.g. AWS account ID
          example: '123456789012'
      description: Private link connection information for disassociation request
    ActiveActivePscEndpointCreateRequest:
      required:
      - endpointConnectionName
      - gcpProjectId
      - gcpVpcName
      - gcpVpcSubnetName
      - pscServiceId
      - regionId
      - subscriptionId
      type: object
      properties:
        subscriptionId:
          type: integer
          format: int32
          readOnly: true
        pscServiceId:
          type: integer
          format: int32
          readOnly: true
        regionId:
          type: integer
          description: Deployment region id as defined by cloud provider
          format: int32
          readOnly: true
          example: 27
        gcpProjectId:
          type: string
          description: Google Cloud project ID.
          example: my-gcp-project
        gcpVpcName:
          type: string
          description: Name of the Google Cloud VPC that hosts your application.
          example: my-vpc
        gcpVpcSubnetName:
          type: string
          description: Name of your VPC's subnet of IP address ranges.
          example: my-vpc-subnet
        endpointConnectionName:
          type: string
          description: Prefix used to create PSC endpoints in the consumer application VPC. Endpoint names appear in Google Cloud as endpoint name prefix + endpoint number.
          example: my-endpoint-connection
        commandType:
          type: string
          readOnly: true
      description: Private Service Connect endpoint create request
    VpcPeeringCreateAwsRequest:
      required:
      - awsAccountId
      - region
      - vpcId
      type: object
      properties:
        provider:
          type: string
        region:
          type: string
          description: Deployment region as defined by the cloud provider.
          example: us-east-1
        awsAccountId:
          type: string
          description: AWS Account ID.
          example: <aws-account-id>
        vpcId:
          type: string
          description: VPC ID.
          example: <vpc-identifier>
        vpcCidr:
          type: string
          description: Optional. VPC CIDR.
          example: <10.10.10.0/24>
        vpcCidrs:
          type: array
          description: Optional. List of VPC CIDRs.
          example:
          - <10.10.10.0/24>
          - <10.10.20.0/24>
          items:
            type: string
            description: Optional. List of VPC CIDRs.
            example: '["<10.10.10.0/24>","<10.10.20.0/24>"]'
        commandType:
          type: string
          readOnly: true
      description: VPC peering creation request message
    PrivateLinkConnectionsDisassociateRequest:
      required:
      - connections
      type: object
      properties:
        subscriptionId:
          type: integer
          format: int32
          readOnly: true
        connections:
          type: array
