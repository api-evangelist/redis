      properties:
        subscriptionId:
          type: integer
          format: int32
          readOnly: true
        principal:
          type: string
          description: AWS account ID or ARN of the principal (IAM user, role, or account)
          example: '123456789012'
        type:
          type: string
          description: Type of the principal
          example: aws_account
          enum:
          - aws_account
          - organization
          - organization_unit
          - iam_role
          - iam_user
          - service_principal
        alias:
          type: string
          description: Alias or friendly name for the principal
          example: Production Account
        commandType:
          type: string
          readOnly: true
      description: Private Link principals create request
    PscEndpointCreateRequest:
      required:
      - endpointConnectionName
      - gcpProjectId
      - gcpVpcName
      - gcpVpcSubnetName
      - pscServiceId
      - subscriptionId
      type: object
      properties:
        subscriptionId:
          type: integer
          format: int32
          readOnly: true
        pscServiceId:
          type: integer
          format: int32
          readOnly: true
        gcpProjectId:
          type: string
          description: Google Cloud project ID.
          example: my-gcp-project
        gcpVpcName:
          type: string
          description: Name of the Google Cloud VPC that hosts your application.
          example: my-vpc
        gcpVpcSubnetName:
          type: string
          description: Name of your VPC's subnet of IP address ranges.
          example: my-vpc-subnet
        endpointConnectionName:
          type: string
          description: Prefix used to create PSC endpoints in the consumer application VPC. Endpoint names appear in Google Cloud as endpoint name prefix + endpoint number.
          example: my-endpoint-connection
        commandType:
          type: string
          readOnly: true
      description: Private Service Connect endpoint create request
    VpcPeeringCreateGcpRequest:
      required:
      - vpcNetworkName
      - vpcProjectUid
      type: object
      properties:
        provider:
          type: string
        vpcProjectUid:
          type: string
          description: VPC project ID.
          example: <vpc-identifer>
        vpcNetworkName:
          type: string
          description: VPC network name.
          example: <name>
        commandType:
          type: string
          readOnly: true
      description: Vpc peering creation request message
    PrivateLinkActiveActiveCreateRequest:
      required:
      - principal
      - regionId
      - shareName
      - type
      type: object
      properties:
        subscriptionId:
          type: integer
          format: int32
          readOnly: true
        regionId:
          type: integer
          description: Deployment region id as defined by cloud provider
          format: int32
          readOnly: true
        shareName:
          maxLength: 64
          minLength: 0
          type: string
          description: Name for the resource share
          example: my-private-link-share
        principal:
          type: string
          description: AWS account ID or ARN of the principal (IAM user, role, or account)
          example: '123456789012'
        type:
          type: string
          description: Type of the principal
          example: aws_account
          enum:
          - aws_account
          - organization
          - organization_unit
          - iam_role
          - iam_user
          - service_principal
        alias:
          type: string
          description: Alias or friendly name for the principal
          example: Production Account
        commandType:
          type: string
          readOnly: true
      description: Request to create a private link for Active-Active subscription
    PscEndpointUpdateRequest:
      required:
      - endpointId
      - pscServiceId
      - subscriptionId
      type: object
      properties:
        subscriptionId:
          type: integer
          format: int32
          readOnly: true
        pscServiceId:
          type: integer
          format: int32
          readOnly: true
        endpointId:
          type: integer
          format: int32
          readOnly: true
        gcpProjectId:
          type: string
          description: Google Cloud project ID.
