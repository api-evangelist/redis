          example: <10.10.10.0/24>
        vpcCidrs:
          type: array
          description: Optional. List of VPC CIDRs.
          example:
          - <10.10.10.0/24>
          - <10.10.22.0/24>
          items:
            type: string
            description: Optional. List of VPC CIDRs.
            example: '["<10.10.10.0/24>","<10.10.22.0/24>"]'
        commandType:
          type: string
          readOnly: true
      description: Active-Active VPC peering update request message
    ActiveActiveVpcPeeringCreateAwsRequest:
      required:
      - awsAccountId
      - destinationRegion
      - sourceRegion
      - vpcId
      type: object
      properties:
        provider:
          type: string
        subscriptionId:
          type: integer
          format: int32
          readOnly: true
        sourceRegion:
          type: string
          description: Name of region to create a VPC peering from.
        destinationRegion:
          type: string
          description: Name of region to create a VPC peering to.
          example: us-east-1
        awsAccountId:
          type: string
          description: AWS Account ID.
          example: <aws-account-id>
        vpcId:
          type: string
          description: VPC ID.
          example: <vpc-identifier>
        vpcCidr:
          type: string
          description: Optional. VPC CIDR.
          example: <10.10.10.0/24>
        vpcCidrs:
          type: array
          description: Optional. List of VPC CIDRs.
          example:
          - <10.10.10.0/24>
          - <10.10.20.0/24>
          items:
            type: string
            description: Optional. List of VPC CIDRs.
