components:
  schemas:
    MemoryStoreTypeStrategyUpdate:
      required:
      - typeName
      type: object
      properties:
        typeName:
          maxLength: 64
          minLength: 0
          pattern: ^[a-zA-Z][a-zA-Z0-9_-]*$
          type: string
          description: Name of the existing custom memory type to edit. Required
          example: travel_preference
        prompt:
          type: string
          description: Replacement extraction prompt. Omit to leave unchanged
        enabled:
          type: boolean
          description: Replacement enabled flag. Omit to leave unchanged
          example: true
      description: Edit of the extraction strategy of an existing custom memory type. Only the prompt and the enabled flag may change; the type's name, description and fields are immutable
    MemoryStoreExtractionCadenceConfig:
      required:
      - activeIntervalSeconds
      type: object
      properties:
        activeIntervalSeconds:
          maximum: 600
          minimum: 60
          type: integer
          description: Interval in seconds between extraction runs while a session is active (60-600). Required
          format: int32
          example: 120
      description: How often the long-term memory extraction pipeline runs. Optional on both create and update
    MemoryStoreCustomMemoryType:
      required:
      - description
      - name
      type: object
      properties:
        name:
          maxLength: 64
          minLength: 0
          pattern: ^[a-zA-Z][a-zA-Z0-9_-]*$
          type: string
          description: Unique type name within the store (1-64 characters, starts with a letter, then letters, digits, underscores or dashes). Must not collide with the built-in types semantic, episodic, message and session_summary_view. Required
          example: travel_preference
        description:
          maxLength: 200
          minLength: 0
          type: string
          description: Human-readable description of what this type captures (1-200 characters). Required
          example: Preferences the user expressed about travel
        fields:
          type: array
          description: Structured fields of a record of this type. Optional; a type without fields accepts direct writes without structured attributes
          items:
            $ref: '#/components/schemas/MemoryStoreCustomField'
        extractionStrategy:
          $ref: '#/components/schemas/MemoryStoreCustomExtractionStrategy'
      description: A custom category of long-term memory with its structured fields and optional extraction strategy. Name, description and fields are immutable once registered
    MemoryStoreSummarizationThresholdConfig:
      required:
      - retainCount
      - threshold
      type: object
      properties:
        threshold:
          maximum: 10000
          minimum: 0
          type: integer
          description: Number of active session events that triggers a summarization cycle (0-10000). Must be greater than retainCount. Required
          format: int32
          example: 50
        retainCount:
          maximum: 10000
          minimum: 0
          type: integer
          description: Number of most recent events kept unsummarized after each cycle (0-10000); everything older is condensed into the running summary. Must be less than threshold. Required
          format: int32
          example: 10
      description: Event-count trigger for session summarization. threshold must be greater than retainCount
    MemoryStoreCustomDetectorsConfig:
      required:
      - enabled
      type: object
      properties:
        enabled:
          type: boolean
          description: Toggle for the whole custom group. False leaves the detectors stored but inactive. Required
          example: true
        detectors:
          maxItems: 32
          minItems: 0
          type: array
          description: Authored detectors (at most 32). On update, omitting this list keeps the stored detectors; a non-empty list replaces them wholesale; an explicitly empty list clears them
          items:
            $ref: '#/components/schemas/MemoryStoreCustomDetector'
      description: Deterministic detection using customer-authored detectors stored on the store. Evaluated together with the built-in detectors as one set
    MemoryStoreLongTermMemoryCreateConfig:
      required:
      - ttlSeconds
      type: object
      properties:
        ttlSeconds:
          maximum: 31536000
          minimum: 1
          type: integer
          description: Time-to-live of long-term memory entries, in seconds (1 second to 1 year). Required
          format: int32
          example: 31536000
        embedding:
          $ref: '#/components/schemas/MemoryStoreModelConfig'
      description: Long-term (persistent) memory configuration accepted on creation. When omitted, the store uses the default long-term memory TTL of 1 year
    MemoryStoreApiKeyCreateRequest:
      required:
      - keyName
      type: object
      properties:
        keyName:
          maxLength: 100
          minLength: 0
          pattern: ^\S+$
          type: string
          description: Name of the API key.
          example: my-agent-key
      description: Memory store API key creation request
    MemoryStoreLongTermMemoryUpdateConfig:
      type: object
      properties:
        ttlSeconds:
          maximum: 31536000
          minimum: 1
          type: integer
          description: New time-to-live of long-term memory entries, in seconds (1 second to 1 year). Omit to leave unchanged
          format: int32
          example: 31536000
        embedding:
          $ref: '#/components/schemas/MemoryStoreModelConfig'
      description: Long-term memory configuration accepted on update. Only the TTL and the embedding credential can change
    MemoryStoreModelConfig:
      type: object
      properties:
        provider:
          type: string
          description: Model provider. Validated against the providers supported by the Agent Memory service. Immutable after creation
          example: openai
        model:
          type: string
          description: Model name as advertised by the provider. Required on create. On update, omit to keep the current model; the LLM model may be changed within the stored provider, the embedding model may not
          example: gpt-4o-mini
        credentials:
          $ref: '#/components/schemas/MemoryStoreModelCredentials'
      description: 'Requested model selection for one purpose (LLM or embedding). On create, llm and longTermMemory.embedding must be supplied together to opt the store into customer-selected models; supplying only one is rejected. Omitting both keeps the platform-owned configuration, and such a store cannot be moved onto customer-selected models later: an update with llm is rejected with /errors/model-config-immutable'
    MemoryStoreCreateRequest:
      required:
      - databaseId
      - name
      type: object
      properties:
        name:
          maxLength: 64
          minLength: 0
          type: string
          description: Memory store name
          example: my-memory-store
        databaseId:
          type: integer
          description: ID of the database used by the memory store
          format: int32
          example: 12345
        shortMemory:
          $ref: '#/components/schemas/MemoryStoreShortMemoryConfig'
        longTermMemory:
          $ref: '#/components/schemas/MemoryStoreLongTermMemoryCreateConfig'
        llm:
          $ref: '#/components/schemas/MemoryStoreModelConfig'
        extractionStrategy:
          type: string
          description: How long-term memories are extracted from sessions. INSTRUCT uses LLM tool calling to create, update and delete granular memories
          example: INSTRUCT
          enum:
          - INSTRUCT
        summarization:
          $ref: '#/components/schemas/MemoryStoreSummarizationConfig'
        longTermMemoryExclusions:
          $ref: '#/components/schemas/MemoryStoreLongTermMemoryExclusions'
        customMemoryTypes:
          maxItems: 3
          minItems: 0
          type: array
          description: Optional. Custom memory types to register on the store (at most 3 per store). When omitted only the built-in types are available
          items:
            $ref: '#/components/schemas/MemoryStoreCustomMemoryType'
        extractionCadence:
          $ref: '#/components/schemas/MemoryStoreExtractionCadenceConfig'
        commandType:
          type: string
          readOnly: true
      description: Memory store creation request
    MemoryStoreDetectorSelection:
      required:
      - enabled
      - id
      type: object
      properties:
        id:
          type: string
          description: 'Built-in detector ID from the Agent Memory detector catalog: credit-card, email, ip-address, phone or us-ssn. Unknown IDs are rejected. Required'
          example: credit-card
        enabled:
          type: boolean
          description: Whether this detector is active. A disabled selection is still stored. Required
          example: true
        action:
          type: string
          description: What happens to a memory this detector matches. Defaults to redact. When several detectors disagree, drop wins
          example: redact
          enum:
          - redact
          - drop
      description: One selected platform built-in detector
    MemoryStoreSemanticExclusionConfig:
      required:
      - enabled
      type: object
      properties:
        enabled:
          type: boolean
          description: Whether semantic exclusion is enabled. Required
          example: true
        prompt:
          type: string
          description: Customer-authored instruction describing what must not be remembered (max 2000 characters). On update, omit to keep the stored prompt
          example: Do not remember payment card numbers or home addresses
      description: Advisory, LLM-mediated exclusion of sensitive content from long-term memory
    MemoryStoreRegexSpec:
      required:
      - pattern
      type: object
      properties:
        pattern:
          maxLength: 512
          minLength: 0
          type: string
          description: Pattern in RE2 syntax (1-512 characters). Lookaround and backreferences are not supported. Rejected if it does not compile or can match empty text. Required
          example: \b\d{3}-\d{2}-\d{4}\b
      description: Regular expression matcher
    MemoryStoreCustomExtractionStrategy:
      required:
      - prompt
      type: object
      properties:
        prompt:
          type: string
          description: Prompt used to extract memories of this type. Required
          example: Extract the user's travel preferences
        enabled:
          type: boolean
          description: Whether extraction for this type is active. Defaults to true
          example: true
      description: How memories of a custom type are extracted from session events
