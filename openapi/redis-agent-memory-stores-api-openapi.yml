          type: array
          items:
            $ref: '#/components/schemas/MemoryStoreEndpoint'
        extractionStrategy:
          type: string
          description: How long-term memories are extracted from sessions. INSTRUCT uses LLM tool calling to create, update and delete granular memories
          enum:
          - INSTRUCT
        summarization:
          $ref: '#/components/schemas/MemoryStoreSummarizationConfig'
        longTermMemoryExclusions:
          $ref: '#/components/schemas/MemoryStoreLongTermMemoryExclusions'
        customMemoryTypes:
          type: array
          items:
            $ref: '#/components/schemas/MemoryStoreCustomMemoryType'
        extractionCadence:
          $ref: '#/components/schemas/MemoryStoreExtractionCadenceConfig'
        status:
          type: string
          description: Lifecycle status of the memory store
          enum:
          - PROVISIONING
          - READY
          - UNAVAILABLE
        errorMessage:
          type: string
        errorMessageTimestamp:
          type: number
          format: double
      description: Memory store configuration and status
    MemoryStoreCustomField:
      required:
      - description
      - name
      - type
      type: object
      properties:
        name:
          maxLength: 64
          minLength: 0
          pattern: ^[a-zA-Z][a-zA-Z0-9_-]*$
          type: string
          description: Field name (1-64 characters, starts with a letter, then letters, digits, underscores or dashes). Required
          example: preferred_airline
        description:
          maxLength: 200
          minLength: 0
          type: string
          description: Human-readable description of the field (1-200 characters). Required
          example: Airline the user prefers to fly with
        type:
          type: string
          description: Field data type. Required
          example: str
          enum:
          - str
          - int
          - float
          - bool
          - list[str]
          - list[float]
          - object
      description: A structured field of a custom memory type
    TaskStateUpdate:
      type: object
      properties:
        taskId:
          type: string
          format: uuid
        commandType:
          type: string
        status:
          type: string
          enum:
          - initialized
          - received
          - processing-in-progress
          - processing-completed
          - processing-error
        description:
          type: string
        timestamp:
          type: string
          format: date-time
        response:
          $ref: '#/components/schemas/ProcessorResponse'
        links:
          type: array
          items:
            type: object
            additionalProperties:
              type: string
    MemoryStoreUpdateRequest:
      type: object
      properties:
        name:
          maxLength: 64
          minLength: 1
          pattern: .*\S.*
          type: string
          description: Optional. New memory store name (1-64 characters)
          example: my-memory-store
        shortMemory:
          $ref: '#/components/schemas/MemoryStoreShortMemoryConfig'
        longTermMemory:
          $ref: '#/components/schemas/MemoryStoreLongTermMemoryUpdateConfig'
        llm:
          $ref: '#/components/schemas/MemoryStoreModelConfig'
        summarization:
          $ref: '#/components/schemas/MemoryStoreSummarizationConfig'
        longTermMemoryExclusions:
          $ref: '#/components/schemas/MemoryStoreLongTermMemoryExclusions'
        addCustomMemoryTypes:
          maxItems: 3
          minItems: 0
          type: array
          description: Optional. New custom memory types to append to the store's registry. A store may define at most 3 custom memory types in total, including those already registered. Existing types cannot be redefined
          items:
            $ref: '#/components/schemas/MemoryStoreCustomMemoryType'
        updateCustomMemoryTypeStrategies:
          type: array
          description: Optional. Extraction strategy edits (prompt and enabled flag) for existing custom memory types
          items:
            $ref: '#/components/schemas/MemoryStoreTypeStrategyUpdate'
        extractionCadence:
          $ref: '#/components/schemas/MemoryStoreExtractionCadenceConfig'
        commandType:
          type: string
          readOnly: true
      description: Memory store update request
    MemoryStoreSummarizationConfig:
      required:
      - enabled
      type: object
      properties:
        enabled:
          type: boolean
          description: Whether summarization is enabled for the store. Required
          example: true
        triggerStrategy:
          type: string
          description: What triggers a summarization cycle. Defaults to event_count
          example: event_count
          enum:
          - event_count
        eventCount:
          $ref: '#/components/schemas/MemoryStoreSummarizationThresholdConfig'
      description: Session summarization. When enabled, long sessions are periodically condensed into a running summary while the most recent events are retained. When omitted on create, nothing is stored and the store uses the deployment's default summarization settings, which GET returns as the store's summarization
    MemoryStoreSummary:
      type: object
      properties:
        storeId:
          type: string
        name:
          type: string
        createdAt:
          type: string
          format: date-time
        databaseId:
          type: string
        databaseName:
          type: string
        subscriptionId:
          type: string
        extractionStrategy:
          type: string
          description: How long-term memories are extracted from sessions. INSTRUCT uses LLM tool calling to create, update and delete granular memories
          enum:
          - INSTRUCT
        summarization:
          $ref: '#/components/schemas/MemoryStoreSummarizationConfig'
        llm:
          $ref: '#/components/schemas/MemoryStoreModelStatus'
        status:
          type: string
          description: Lifecycle status of the memory store
          enum:
          - PROVISIONING
          - READY
          - UNAVAILABLE
    MemoryProblemDetails:
      type: object
      properties:
        type:
          type: string
          description: Stable, machine-readable error type, e.g. /errors/resource-not-found, /errors/invalid-data, /errors/insufficient-permissions, /errors/model-config-immutable
          example: /errors/resource-not-found
        title:
          type: string
          description: Short human-readable summary of the error type
          example: Resource not found
        status:
          type: integer
          description: HTTP status code of the response, repeated in the body
          format: int32
          example: 404
        detail:
          type: string
          description: Human-readable explanation specific to this occurrence
          example: memory store store-123 was not found
        instance:
          type: string
          description: Identifier of the specific occurrence, when provided by the service
        fields:
          type: array
          description: Per-field validation failures for /errors/invalid-data responses
          items:
            $ref: '#/components/schemas/MemoryProblemFieldError'
      description: RFC 7807 problem details returned by the Agent Memory service when a synchronous memory store request fails. Returned with the application/problem+json media type
    MemoryStoreLongTermMemoryStatus:
      type: object
      properties:
        ttlSeconds:
          type: integer
          description: Time-to-live of long-term memory entries, in seconds
          format: int32
          example: 31536000
        embedding:
          $ref: '#/components/schemas/MemoryStoreModelStatus'
      description: Long-term memory configuration as stored
    MemoryStoreBuiltInDetectorsConfig:
      required:
      - enabled
      type: object
      properties:
        enabled:
          type: boolean
          description: Toggle for the whole built-in group. False leaves the selections stored but inactive. Required
          example: true
        detectors:
          type: array
          description: Selected detectors. On update, omitting this list keeps the stored selections; a non-empty list replaces them wholesale; an explicitly empty list clears them
          items:
            $ref: '#/components/schemas/MemoryStoreDetectorSelection'
      description: Deterministic detection using platform-owned built-in detectors. Nothing is selected by default
    MemoryStoreEndpoint:
      type: object
      properties:
        url:
          type: string
          description: Endpoint URL
        provider:
          type: string
          description: Cloud provider hosting the endpoint
          example: AWS
        region:
          type: string
          description: Cloud region of the endpoint
          example: us-east-1
        egressIps:
          type: array
          description: Egress IP addresses used by the endpoint
          items:
            type: string
            description: Egress IP addresses used by the endpoint
        isAccessible:
          type: boolean
          description: Whether the endpoint is reachable from the store's database network
      description: A regional endpoint through which the memory store is served
    MemoryStoreShortMemoryConfig:
      required:
      - ttlSeconds
      type: object
      properties:
        ttlSeconds:
          maximum: 31536000
          minimum: 1
          type: integer
          description: Time-to-live of short-term memory entries, in seconds (1 second to 1 year). Required
          format: int32
          example: 86400
      description: Short-term (working) memory configuration
    MemoryStoreLongTermMemoryExclusions:
      required:
      - enabled
      type: object
      properties:
        enabled:
          type: boolean
          description: Master toggle gating enforcement of all exclusion groups. Required
          example: true
        semantic:
          $ref: '#/components/schemas/MemoryStoreSemanticExclusionConfig'
        builtInDetectors:
          $ref: '#/components/schemas/MemoryStoreBuiltInDetectorsConfig'
        customDetectors:
          $ref: '#/components/schemas/MemoryStoreCustomDetectorsConfig'
      description: Store-level policy that keeps sensitive data out of long-term memory. When omitted on create, no policy is stored. On update, the policy is replaced as a whole but nested content that is omitted is preserved, so prefer read-modify-write of the complete policy. Disabling sets enabled=false; a stored policy cannot be removed
    MemoryStoreListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/MemoryStoreSummary'
      description: List of memory stores
    MemoryStoreModelStatus:
      type: object
      properties:
        provider:
          type: string
          description: Model provider in use
          example: openai
        model:
          type: string
          description: Model in use
          example: gpt-4o-mini
      description: Resolved model in use for one purpose. Present only on stores with an explicit model selection
    MemoryStoreCustomDetector:
      required:
      - enabled
      - matcher
      - name
      type: object
      properties:
        name:
          maxLength: 64
          minLength: 0
          pattern: ^[a-zA-Z][a-zA-Z0-9_-]*$
          type: string
          description: Detector name (1-64 characters, starts with a letter, then letters, digits, underscores or dashes). Reported with every match; must be unique in the store and must not collide with a built-in detector ID. Required
          example: internal-ticket-id
        enabled:
          type: boolean
          description: Whether this detector is active. A disabled detector is still stored and validated. Required
          example: true
        action:
          type: string
          description: What happens to a memory this detector matches. Defaults to redact
          example: redact
          enum:
          - redact
          - drop
        matcher:
          $ref: '#/components/schemas/MemoryStoreMatcherSpec'
      description: One customer-authored detector
    MemoryStoreApiKeyCreateResponse:
      type: object
      properties:
        apiKey:
          type: string
          description: Generated API key. Returned only once.
          format: password
      description: New memory store API key
    MemoryStoreMatcherSpec:
      required:
      - kind
      type: object
      properties:
        kind:
          type: string
          description: Matching technique. Required
          example: regex
          enum:
          - regex
        regex:
          $ref: '#/components/schemas/MemoryStoreRegexSpec'
      description: How a custom detector decides what to match. Exactly the block named by kind must be present
    MemoryStoreModelCredentials:
      required:
      - type
      type: object
      properties:
        type:
          type: string
          description: How the supplied secret is interpreted. Required
          example: apiKey
          enum:
          - apiKey
        apiKey:
          type: string
          description: The provider API key. Required on create. On update an omitted or blank value keeps the current key, so only the key being rotated needs to be sent
          format: password
          writeOnly: true
      description: 'Customer-supplied credential for a model provider. Write-only: never returned by any operation'
    MemoryProblemFieldError:
      type: object
      properties:
        field:
          type: string
          description: Path of the offending request field
          example: shortMemory.ttlSeconds
        rule:
          type: string
          description: Validation rule that failed
          example: min
        message:
          type: string
          description: Human-readable message for the failure
          example: must be at least 1
      description: A single field validation failure
  securitySchemes:
    x-api-key:
      type: apiKey
      name: x-api-key
      in: header
    x-api-secret-key:
      type: apiKey
      name: x-api-secret-key
      in: header
    x-auth-token:
      type: apiKey
      name: x-auth-token
      in: header
externalDocs:
  description: Redis Cloud API Documentation
  url: https://docs.redislabs.com/latest/rc/api/
