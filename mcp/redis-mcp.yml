tools:
- name: search
  description: 'Search the Redis documentation by free-text query. Returns up to 8 matching pages, each
    with a text snippet and that page''s stable `id`.


    This is the default tool for a Redis question. Search first, then `fetch` any `id` whose full text
    you need — one search plus a fetch or two answers most questions.'
- name: fetch
  description: 'Return the full text and metadata for one Redis documentation page: title, canonical URL,
    body text, and topic/version/section metadata.


    Takes an `id` from a `search` result or from an `ask` result''s `sources`. Use it when a snippet is
    not enough to answer confidently, or to quote the documentation exactly.'
- name: ask
  description: 'Ask a natural-language question about Redis. Returns a prose answer plus the source documents
    behind it — any `sources[].id` can be passed to `fetch`. If the documentation does not cover the question,
    the answer says so.


    Reserve `ask` for a question spanning several areas of the documentation, where no single page answers
    and the parts interact — or when a `search` has come back empty or off-target. `ask` takes several
    seconds, so use `search` and `fetch` for anything narrower.'
